name: Instant Testing
# regular update on sales and RS actual. 

on:
  push:
    branches:
      - main  # Change this to the branch you want to trigger on

#on:
#  schedule:
#   #- cron: '0,30 1-14 * * 1-6'  # Runs every 30 minutes from 1 AM to 2:30 PM UTC, Monday to Saturday, 9-11 HK time
#    - cron: '0 1-14 * * 1-6'  # Runs every 30 minutes from 1 AM to 2:30 PM UTC, Monday to Saturday, 9-11 HK time




jobs:
  download-file:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium gspread oauth2client pandas

      - name: Set up ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'latest'
          install-chromedriver: true
          install-dependencies: true

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - run: |
          echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV
          echo "CHROMEDRIVER_PATH=${{ steps.setup-chrome.outputs.chromedriver-path }}" >> $GITHUB_ENV

      - name: Download file using Selenium
        env:
          _URL: ${{ secrets._URL }}
          _USERNAME: ${{ secrets._USERNAME }}
          _PASSWORD: ${{ secrets._PASSWORD }}
          _GOOGLE_CRED: ${{ secrets._GOOGLE_CRED }}
          
        run: |
          python hourly_action.py
          